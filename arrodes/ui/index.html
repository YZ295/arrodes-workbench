<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>谦卑之心</title>
<link rel="stylesheet" href="team-canvas.css" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html {
    color-scheme: light;
    --surface: #ffffff;
    --sidebar: #f4f5f7;
    --panel: #fafbfc;
    --ink: #1d1d1f;
    --text: #30343b;
    --muted: #545d6c;
    --line: #d9dee6;
    --hover: #e9edf2;
    --selection: #e8f1ff;
    --accent: #0064d2;
    --accent-ink: #0753a4;
    --focus: #0874dc;
    --error: #a52e33;
    --error-bg: #fff0f0;
    --error-line: #edb9ba;
    --overlay: #24324963;
    --shadow: #1829421f;
    --success: #247153;
    --warning: #875619;
    --canvas-grid: #cad3e1;
  }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif; background: var(--surface); color: var(--ink); }
  #root { display: flex; flex: 1; flex-direction: column; min-height: 0; }
  .window-titlebar {
    display: flex; flex: 0 0 auto; align-items: center; gap: 8px;
    height: env(titlebar-area-height, 32px); padding-inline: 14px;
    width: env(titlebar-area-width, 100%); background: var(--surface);
    border-bottom: 1px solid var(--line); color: var(--ink); font-size: 12px;
    app-region: drag; user-select: none;
  }

  .app-frame { display: grid; grid-template-columns: clamp(180px, 23vw, 232px) minmax(0, 1fr); height: 100%; min-height: 0; }
  .chat-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .sidebar { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--sidebar); border-right: 1px solid var(--line); }
  .sidebar .brand { padding: 18px 16px; color: var(--ink); }
  .sidebar nav { flex: 1; overflow: auto; padding: 4px 10px 14px; }
  .sidebar section { margin-top: 19px; }
  .sidebar header, .project-row { display: flex; align-items: center; gap: 4px; }
  .sidebar header { min-height: 28px; padding-left: 9px; justify-content: space-between; }
  .sidebar h2 { font-size: 12px; color: var(--muted); font-weight: 600; }
  .nav-button, .icon-button { border: 0; border-radius: 6px; background: transparent; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .nav-button { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 32px; width: 100%; padding: 6px 9px; text-align: left; }
  .nav-button span:not(.avatar) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-button:hover, .icon-button:hover { background: var(--hover); color: var(--ink); }
  .nav-button[aria-current="true"] { background: var(--selection); color: var(--accent-ink); }
  .nav-button:disabled, .icon-button:disabled { opacity: .55; cursor: default; }
  .nav-button:focus-visible, .icon-button:focus-visible, .tool:focus-visible, .send:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .nav-icon { flex: 0 0 auto; width: 15px; height: 15px; }
  .icon-button { display: grid; flex: 0 0 27px; place-items: center; width: 27px; height: 27px; }
  .recent-list { max-height: 176px; overflow: auto; }
  .session-row { display: flex; align-items: center; gap: 2px; }
  .session-row .nav-button { flex: 1; }
  .session-action { opacity: 0; }
  .session-row:hover .session-action, .session-row:focus-within .session-action { opacity: 1; }
  .archive-list { margin-top: 8px; }
  .archive-list summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 7px 9px; }
  .archived-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
  .project-row > .nav-button { flex: 1; }
  .project-row [aria-expanded="true"] .disclosure { transform: rotate(90deg); }
  .project-sessions { margin: 1px 0 4px 16px; padding-left: 5px; border-left: 1px solid var(--line); }
  .sidebar-footer { padding: 9px 10px; border-top: 1px solid var(--line); }
  .avatar { display: grid; flex: 0 0 27px; place-items: center; width: 27px; height: 27px; border-radius: 50%; background: var(--selection); color: var(--accent-ink); font-size: 12px; }
  .team-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .team-header h1 { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  .repository { overflow: auto; padding: 20px; }
  .repository h2 { font-size: 15px; margin: 0 0 10px; }
  .repository section + section { margin-top: 24px; }
  .repository-list { display: grid; border: 1px solid var(--line); border-radius: 8px; }
  .repository-entry { display: grid; gap: 8px; padding: 12px; min-width: 0; }
  .repository-entry + .repository-entry { border-top: 1px solid var(--line); }
  .repository-entry h3 { margin: 0; font-size: 14px; }
  .repository-entry p { margin: 0; overflow-wrap: anywhere; }
  .repository-actions, .role-options { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .team-actions { display: flex; gap: 7px; }
  .role-dialog { margin: auto; color: var(--ink); }
  .role-dialog::backdrop { background: var(--overlay); }
  .role-dialog dl { max-height: min(52vh, 390px); overflow-y: auto; overflow-wrap: anywhere; }
  .role-dialog dt { font-size: 13px; font-weight: 600; }
  .role-dialog dd { font-size: 12px; color: var(--muted); margin: 4px 0 12px; }
  .role-dialog dd small { display: block; color: #a1acc9; margin-top: 3px; }
  .role-form { display: grid; gap: 10px; }
  .role-form textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .role-access { display: flex; flex-wrap: wrap; gap: 8px 16px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .role-access legend { color: var(--muted); font-size: 12px; padding-inline: 3px; }
  .role-access label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .team-trace { margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--muted); }
  .team-trace summary { cursor: pointer; width: fit-content; color: var(--accent-ink); }
  .team-trace ul { padding: 7px 0 0 19px; }
  .team-trace li { overflow-wrap: anywhere; }
  @media (max-width: 800px) { .sidebar nav, .sidebar-footer { padding-inline: 8px; } }

  .brand { display: flex; align-items: center; gap: 9px; padding: 12px 16px; font-size: 15px; font-weight: 650; color: var(--text); }
  .logo { width: 18px; height: 18px; border-radius: 6px;
    background: radial-gradient(circle at 50% 50%, #fff 0 22%, #c5e0ff 24% 44%, transparent 46%), var(--accent);
    box-shadow: 0 1px 3px #003f8a35; }

  .thread { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 680px; margin: 0 auto; width: 100%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .bubble.user { align-self: flex-end; background: var(--selection); }
  .bubble.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .message-markdown { white-space: normal; overflow-wrap: anywhere; }
  .message-markdown > :first-child { margin-top: 0; }
  .message-markdown > :last-child { margin-bottom: 0; }
  .message-markdown h1, .message-markdown h2, .message-markdown h3 { font-size: 1.12em; }
  .message-markdown ul, .message-markdown ol { padding-inline-start: 1.55em; }
  .message-markdown pre { white-space: pre; overflow: auto; padding: 8px 10px; }
  .message-markdown code { background: var(--selection); border-radius: 4px; padding: 1px 4px; }
  .message-markdown pre code { padding: 0; background: none; }
  .message-markdown table { display: block; overflow: auto; border-collapse: collapse; }
  .message-markdown :is(th, td) { border: 1px solid var(--line); padding: 3px 7px; }
  .message-markdown blockquote { border-inline-start: 2px solid var(--line); margin-inline: 0; padding-inline-start: 12px; }
  .connection-checks { display: flex; gap: 8px; flex-wrap: wrap; }
  .connection-status { margin: 0; min-height: 1.3em; font-size: 12px; color: var(--muted); }
  .bubble.progress { align-self: flex-start; color: var(--muted); font-size: 12px; background: transparent; }
  .bubble.error { align-self: flex-start; background: var(--error-bg); border: 1px solid var(--error-line); color: var(--error); }

  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 24px 40px; }
  .hero h1 { font-size: 34px; font-weight: 650; letter-spacing: -.035em; text-wrap: balance; color: var(--ink); }
  .hero .logo-lg { width: 48px; height: 48px; border-radius: 12px;
    background: radial-gradient(circle at 50% 50%, #fff 0 22%, #c5e0ff 24% 44%, transparent 46%), var(--accent);
    box-shadow: 0 4px 10px #003f8a2b; }

  .composer { padding: 10px 20px 16px; }
  .composer-box { width: min(720px, 100%); margin: 0 auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 14px; box-shadow: 0 4px 16px var(--shadow); }
  .composer-box:focus-within { border-color: var(--focus); }
  textarea { width: 100%; border: 0; outline: none; resize: none; background: transparent; color: var(--ink); font: inherit; font-size: 14px; line-height: 1.5; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .workspace-picker { position: relative; min-width: 0; max-width: 48%; }
  .workspace-picker summary { display: flex; align-items: center; gap: 6px; list-style: none; }
  .workspace-picker summary::-webkit-details-marker { display: none; }
  .workspace-picker summary .disclosure { width: 11px; height: 11px; transform: rotate(90deg); }
  .workspace-picker[open] summary .disclosure { transform: rotate(-90deg); }
  .workspace-label, .workspace-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .workspace-picker .workspace-label { min-width: 0; }
  .workspace-options { position: absolute; bottom: calc(100% + 7px); left: 0; z-index: 3; width: min(355px, 57vw); max-height: 255px; overflow: auto; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 8px 20px var(--shadow); }
  .workspace-option { display: grid; grid-template-columns: 17px minmax(0, 1fr); align-items: center; width: 100%; border: 0; background: transparent; border-radius: 5px; padding: 6px 9px; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
  .workspace-option:hover, .workspace-option[aria-current="true"] { background: var(--selection); }
  .workspace-option:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .workspace-option .workspace-label, .workspace-option .workspace-path { display: block; }
  .workspace-option .workspace-label { font-size: 13px; }
  .workspace-path { margin-top: 2px; color: var(--muted); font-size: 11px; }
  .tool { font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .tool:hover { border-color: var(--focus); color: var(--accent-ink); }
  .workspace-name { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .send { margin-left: auto; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-size: 13px; padding: 6px 18px; cursor: pointer; }
  .send:disabled, .primary:disabled { background: var(--hover); color: var(--muted); cursor: default; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: center; z-index: 10; }
  .dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(440px, 92vw); max-height: calc(100dvh - 36px); overflow: auto; box-shadow: 0 18px 56px #1b2b4430; display: flex; flex-direction: column; gap: 10px; }
  .action-dialog { width: min(600px, calc(100vw - 32px)); padding: 24px; gap: 16px; }
  .action-dialog .actions { margin-top: 2px; }
  .action-path { display: grid; gap: 4px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .action-path code { color: var(--ink); }
  .action-code { margin: 0; max-height: min(35vh, 320px); overflow: auto; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sidebar); color: var(--ink); font: 12px/1.65 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; }
  .execution-card { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); white-space: normal; }
  .execution-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; font-size: 13px; }
  .execution-status { color: var(--muted); font-size: 12px; }
  .execution-status.success { color: #216343; }
  .execution-status.failure { color: #9b2727; }
  .execution-card .action-code { margin-top: 8px; }
  .tool[aria-pressed="true"] { color: var(--accent-ink); background: var(--selection); }
  .approval-picker { position: relative; }
  .approval-picker summary { list-style: none; cursor: pointer; white-space: nowrap; }
  .approval-picker summary::-webkit-details-marker { display: none; }
  .approval-picker summary.full { color: #985000; }
  .approval-options { width: min(305px, calc(100vw - 64px)); }
  .approval-options button { min-height: 46px; }
  .approval-options button:last-child .workspace-label { color: #985000; }
  .toolbar { flex-wrap: wrap; }
  .dialog h2 { font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text); }
  .field[hidden] { display: none; }
  .field :is(input, select) { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .actions .attach-folder { margin-right: auto; }
  .location { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .location .hint { min-width: 0; overflow-wrap: anywhere; }
  .location .ghost { flex: 0 0 auto; }
  .primary { border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-size: 13px; padding: 7px 16px; cursor: pointer; }
  .ghost { border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer; }
  .hint { font-size: 12px; color: var(--muted); }
  .error-text { color: var(--error); font-size: 12px; }
  .send:not(:disabled):hover, .primary:not(:disabled):hover { background: var(--accent-ink); }
  :is(button, input, select, textarea, summary):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .composer-box textarea:focus-visible { outline: none; }
  textarea::placeholder, input::placeholder { color: var(--muted); opacity: 1; }
  ::selection { background: #cfe4ff; color: var(--ink); }
</style>
</head>
<body>
<div class="window-titlebar" aria-hidden="true"><span class="logo"></span>谦卑之心</div>
<div id="root"></div>
<script>
function showStartupError() {
  const notice = document.createElement("p");
  notice.className = "bubble error";
  notice.setAttribute("role", "alert");
  notice.textContent = "谦卑之心未能打开，请关闭窗口后重试。";
  document.getElementById("root").replaceChildren(notice);
}
window.addEventListener("error", showStartupError);
</script>
<script src="team-canvas.js"></script>
<script src="plugin-repository.js"></script>
<script src="vendor/markdown-it/markdown-it.umd.min.js"></script>
<script>
const state = {
  history: [],
  workspace: "默认工作区",
  workspaces: [],
  sessions: [],
  archived: false,
  archiveOpen: false,
  expandedProjects: new Set(),
  conversationId: null,
  view: "chat",
  creator: false,
  approvalMode: "ask",
  switching: false,
  turn: null,
  get busy() { return this.turn !== null; },
  ready: false,
  configured: false,
  notice: "",
};

const root = document.getElementById("root");
const teamCanvas = createTeamCanvas(() => {
  const button = document.getElementById("send");
  if (button && state.view === "collaboration") button.disabled = !state.ready || state.busy || teamCanvas.pending;
});

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node[key.toLowerCase()] = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) {
    node.append(child);
  }
  return node;
}

const markdown = window.markdownit({ html: false, breaks: true });
markdown.renderer.rules.image = (tokens, index) => markdown.utils.escapeHtml(tokens[index].content);
markdown.renderer.rules.link_open = () => "";
markdown.renderer.rules.link_close = () => "";

function render() {
  const focused = document.activeElement?.id;
  root.replaceChildren(build());
  if (focused) document.getElementById(focused)?.focus();
  const thread = document.getElementById("thread");
  if (thread) thread.scrollTop = thread.scrollHeight;
}

function build() {
  const container = el("main", { class: "chat-pane" });
  const frame = el("div", { class: "app-frame" }, sidebar(), container);
  if (state.view === "plugins") {
    container.append(el("header", { class: "team-header" }, el("h1", {}, "插件仓库"),
      el("button", { class: "tool", type: "button", onclick: returnToChat }, "返回对话")));
    container.append(pluginRepository());
    return frame;
  }
  const team = state.view === "collaboration";
  const turn = state.turn?.id === state.conversationId ? state.turn : null;
  const history = turn ? [...state.history, { role: "user", content: turn.text }] : state.history;
  if (state.ready) teamCanvas.sync(state.workspace, state.conversationId, state.history, state.busy, turn?.events);
  if (team) {
    container.append(el("header", { class: "team-header" },
      el("h1", {}, "多 Agent"),
      el("div", { class: "team-actions" },
        el("button", { class: "tool", type: "button", onclick: openTeamRoles }, "可用角色"),
        el("button", { class: "tool", type: "button", onclick: returnToChat }, "返回对话"),
      ),
    ));
    container.append(teamCanvas.root);
  }

  if (state.notice) container.append(el("p", { class: "bubble error", role: "alert" }, state.notice));

  if (!team && history.length === 0) {
    const hero = el("div", { class: "hero" }, el("div", { class: "logo-lg" }), el("h1", {}, "今天想做什么？"));
    hero.append(composer());
    if (!state.archived) hero.append(el("p", { class: "composer-hint" }, "Enter 发送 · Shift + Enter 换行"));
    container.append(hero);
  } else {
    const thread = el("div", { class: team ? "thread team-thread" : "thread", id: "thread" });
    for (const bubble of history) {
      const message = el("div", { class: `bubble ${bubble.role}` });
      if (bubble.role === "assistant") {
        const formatted = el("div", { class: "message-markdown" });
        formatted.innerHTML = markdown.render(bubble.content);
        message.append(formatted);
      } else {
        message.textContent = bubble.content;
      }
      if (bubble.collaboration) message.append(teamTrace(bubble.collaboration));
      if (bubble === state.history.at(-1) && bubble.clarification && !state.archived) {
        message.append(clarificationCard(bubble.clarification, bubble.content));
      }
      if (bubble.executions?.length) {
        const failures = bubble.executions.filter(({ ok, cancelled }) => !ok && !cancelled).length;
        const count = `${bubble.executions.length} 条${failures ? `，${failures} 项失败` : ""}`;
        message.append(el("details", { class: "team-trace" },
          el("summary", {}, `执行记录（${count}）`), ...bubble.executions.map(executionCard)));
      }
      thread.append(message);
    }
    if (turn?.progress) thread.append(el("div", { class: "bubble progress" }, turn.progress));
    container.append(thread);
    const bottom = el("div", { class: "composer" });
    bottom.append(composer());
    container.append(bottom);
  }
  return frame;
}

function teamTrace({ events, checks, canvasEvents }) {
  const steps = (Array.isArray(events) ? events : []).map((event) => el("li", {}, event));
  const skills = (canvasEvents ?? []).filter(({ type }) => type === "skill.applied")
    .map(({ roleName, skills }) => `${roleName} 加载 Skill · ${skills.join("、")}`);
  const evidence = (Array.isArray(checks) ? checks : []).map(({ path, output }) => el("li", {}, `${path} · ${output}`));
  const external = (canvasEvents ?? []).filter(({ type }) => type === "mcp.result").map((event) =>
    el("li", {}, `${event.roleName} · ${event.tool} · ${event.cancelled ? "已取消" : event.ok ? "成功" : "失败"}`,
      event.output ? el("pre", { class: "action-code" }, event.output) : ""));
  return el("details", { class: "team-trace" }, el("summary", {}, "协作过程"),
    el("ul", {}, ...steps, ...[...new Set(skills)].map((entry) => el("li", {}, entry)), ...external, ...evidence));
}

function clarificationCard({ id, question, options }, message) {
  const button = (label, control) => {
    const node = el("button", { type: "button", class: "ghost", onclick: () => send({ id, ...control }, label) }, label);
    node.disabled = state.busy || state.switching;
    return node;
  };
  return el("section", { class: "execution-card", "aria-label": "待确认任务" },
    ...(question === message ? [] : [el("p", {}, question)]),
    ...options.map(({ label, task, inputs, outputs }, index) => el("div", {},
      el("p", { class: "hint" }, [
        task, inputs.length ? `源文件 ${inputs.join("、")}` : "", outputs.length ? `交付 ${outputs.join("、")}` : "",
      ].filter(Boolean).join(" · ")),
      button(label, { index }))),
    el("p", { class: "hint" }, "补充细节时，在输入框以「补充：」开头。"),
    button("取消", { cancel: true }));
}

async function openMcpGrants(role, parent) {
  const status = el("p", { role: "status" });
  const dialog = el("dialog", { class: "dialog role-dialog" });
  const list = el("div", { class: "canvas-skill-list" });
  const close = el("button", { class: "ghost", onclick: () => dialog.close() }, "关闭");
  const save = el("button", { class: "primary" }, "保存权限");
  save.disabled = true;
  dialog.append(el("h2", {}, `${role.name}的 MCP 工具`),
    el("p", { class: "hint" }, "MCP 授权独立于工作区读写权限，调用按当前批准模式处理。"),
    list, status, el("div", { class: "actions" }, close, save));
  dialog.addEventListener("close", () => dialog.remove(), { once: true });

function icon(name) {
  const paths = {
    agents: "M8 2v12M3 5h10M3 11h10M3 4v2m10-2v2M3 10v2m10-2v2",
    chat: "M13.5 10H6l-3.5 2.5V4h11z",
    folder: "M2 12.5v-9h5l1.5 2H14v7z",
    disclosure: "m6 4 4 4-4 4",
    check: "m3 8 3 3 7-7",
    plus: "M8 3v10M3 8h10",
    archive: "M2 3h12v3H2zM3 6v7h10V6M6 8.5h4",
    restore: "M5.5 2.5 2.5 5.5l3 3M2.5 5.5h7a3.5 3.5 0 0 1 0 7H7",
  };
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", `nav-icon ${name}`);
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(svg.namespaceURI, "path");
  path.setAttribute("d", paths[name]);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "1.35");
  path.setAttribute("stroke-linejoin", "round");
  path.setAttribute("stroke-linecap", "round");
  svg.append(path);
  return svg;
}

async function setArchived(id, archived) {
  if (state.busy || state.switching) return;
  state.switching = true;
  state.notice = "";
  try {
    const current = await window.arrodes.archiveConversation(id, archived);
    if (id === state.conversationId) showConversation(current);
    if (archived) state.archiveOpen = true;
    state.sessions = await window.arrodes.listConversations();

    state.notice = "无法更新会话归档状态，请重试。";
  } finally {
    state.switching = false;
    render();
  }
}

async function switchConversation(action) {
  if (state.switching) return;
  state.switching = true;
  state.notice = "";
  try {
    showConversation(await action());
    state.sessions = await window.arrodes.listConversations().catch(() => state.sessions);
    state.draft = "";
  } catch {
    state.notice = "无法打开会话，请重试。";
  } finally {
    state.switching = false;
    render();
    document.getElementById("input")?.focus();
  }
}

async function send(confirmation, answer) {
  const text = (answer ?? state.draft ?? "").trim();
  if (!text || state.archived || state.busy || state.switching || !state.ready ||
      (state.view === "collaboration" && teamCanvas.pending)) return;
  const nativeCoordinator = state.view === "collaboration" && teamCanvas.executorFor({ id: "coordinator" }) !== "builtin";
  if (!state.configured && !nativeCoordinator && !(answer && confirmation?.cancel)) {
    openSettings();
    return;
  }
  const mode = state.view === "collaboration" ? "team" : state.creator ? "creator" : "chat";
  const turn = { id: state.conversationId, text, history: state.history, events: [] };
  state.turn = turn;
  state.draft = "";
  state.notice = "";
  render();

  let result;
  try {
    result = await window.arrodes.send({ text, mode, approvalMode: state.approvalMode, conversationId: turn.id,
      confirmation: answer ? confirmation : undefined });
    if (result.kind !== "need_config" && result.kind !== "unavailable") {
      state.sessions = await window.arrodes.listConversations().catch(() => state.sessions);
    }
  } catch {
    result = { kind: "error", text: "消息处理失败，请重试。" };
  }

  state.turn = null;
  if (state.conversationId !== turn.id) { render(); return; }
  if (result.kind === "need_config" || result.kind === "unavailable") {
    state.draft = text;
    if (result.kind === "unavailable") state.notice = result.text;
    else state.configured = false;
    render();
    if (result.kind === "need_config") openSettings();
    return;
  }

  state.history = [...turn.history, { role: "user", content: text },
    { role: result.kind === "error" ? "error" : "assistant", content: result.text, collaboration: result.collaboration,
      executions: result.executions, clarification: result.clarification }];
  render();
  document.getElementById("input")?.focus();
}

    el("section", {}, el("strong", {}, server.name),
      el("ul", {}, ...server.tools.map((tool) => el("li", {}, tool.name, tool.description ? ` · ${tool.description}` : ""))),
      el("button", { class: "ghost", onclick: () => run(() => window.arrodes.removeMcp(server.id), "已移除服务器及相关授权。") }, "移除"))));
  async function run(operation, message) {
    if (pending) return;
    pending = connect.disabled = true;
    try {
      const result = await operation();
      if (result.ok) show(result.servers);
      status.textContent = result.ok ? message : result.error;
    } catch (error) { status.textContent = error.message; }
    finally { pending = connect.disabled = false; }
  }
  connect.onclick = () => run(async () => {
    let parameters;
    try { parameters = JSON.parse(args.value.trim() || "[]"); }
    catch { throw new Error("请把启动参数写成 JSON 字符串数组。"); }
    status.textContent = "正在启动服务器并读取工具…";
    return window.arrodes.connectMcp({ name: name.value, command: command.value, args: parameters });
  }, "连接成功。可在多 Agent 的可用角色中配置工具权限。");
  dialog.append(el("h2", {}, "MCP 服务器"),
    el("p", { class: "hint" }, "本地 stdio 服务器以当前系统用户身份运行。请填写你信任的可执行程序与参数。"),
    field("服务器名称", name), field("可执行程序", command), field("启动参数（JSON 数组）", args),
    status, list, el("div", { class: "actions" }, close, connect));
  dialog.addEventListener("close", () => dialog.remove(), { once: true });
  document.body.append(dialog);
  dialog.showModal();
  window.arrodes.listMcpServers().then(show).catch(() => { status.textContent = "无法读取已保存的服务器。"; });
}

function openSettings() {
  window.arrodes.getConfig().then((config) => {
    const backdrop = el("div", { class: "backdrop" });
    const dialog = el("div", { class: "dialog" });
    dialog.append(el("h2", {}, "连接模型"));
    dialog.append(el("p", { class: "hint" }, "API Key 加密保存在本机，用于连接你配置的模型服务。"));

    const baseUrl = el("input", { value: config.baseUrl ?? "" });
    const modelId = el("input", { value: config.modelId ?? "" });
    const apiKey = el("input", { type: "password", value: "", placeholder: config.configured ? "已保存（重新输入可更换）" : "sk-..." });
    const errorLine = el("p", { class: "error-text", role: "alert" });
    const status = el("p", { class: "connection-status", role: "status" });
    const modelList = el("select");
    const modelField = field("已发现模型", modelList);
    modelField.hidden = true;
    const draft = () => ({ baseUrl: baseUrl.value, modelId: modelId.value, apiKey: apiKey.value });
    let revision = 0;

    const check = async (mode) => {
      const current = revision;
      getModels.disabled = testConnection.disabled = true;
      status.textContent = mode === "list" ? "正在获取模型…" : "正在测试连接…";
      errorLine.textContent = "";
      try {
        const result = await (mode === "list" ? window.arrodes.listModels(draft()) : window.arrodes.testModel(draft()));
        if (current !== revision || !backdrop.isConnected) return;
        if (result.error) {
          status.textContent = "";
          errorLine.textContent = result.error;
        } else if (mode === "list") {
          modelList.replaceChildren(el("option", { value: "" }, "选择模型"),
            ...result.models.map((id) => el("option", { value: id }, id)));
          modelField.hidden = result.models.length === 0;
          status.textContent = result.models.length
            ? `找到 ${result.models.length} 个模型。选择后可测试连接。`
            : "接口未返回模型，可手动填写后测试连接。";
        } else {
          status.textContent = "连接成功，模型已返回回复。";
        }
      } catch {
        if (current !== revision || !backdrop.isConnected) return;
        status.textContent = "";
        errorLine.textContent = "连接检查失败，请重试。";
      } finally {
        getModels.disabled = testConnection.disabled = false;
      }
    };
    const getModels = el("button", { class: "ghost", onclick: () => check("list") }, "获取模型");
    const testConnection = el("button", { class: "ghost", onclick: () => check("test") }, "测试连接");
    const clearStatus = () => {
      revision += 1;
      status.textContent = "";
      errorLine.textContent = "";
    };
    for (const input of [baseUrl, apiKey]) {
      input.addEventListener("input", () => {
        clearStatus();
        modelField.hidden = true;
        modelList.replaceChildren();
      });
    }
    modelId.addEventListener("input", clearStatus);
    modelList.addEventListener("change", () => {
      if (modelList.value) modelId.value = modelList.value;
      clearStatus();
    });

    dialog.append(
      field("接口地址", baseUrl),
      field("API Key", apiKey),
      field("模型", modelId),
      el("div", { class: "connection-checks" }, getModels, testConnection),
      modelField,
      status,
      errorLine,
    );

    const save = async () => {
      try {
        const result = await window.arrodes.saveConfig(draft());
        if (!result.ok) {
          errorLine.textContent = result.error;
          return;
        }
        state.configured = true;
        backdrop.remove();
        render();
      } catch {
        errorLine.textContent = "无法保存模型设置，请重试。";
      }
    };

    const actions = el("div", { class: "actions" },
      el("button", { class: "ghost", onclick: () => { backdrop.remove(); openMcpSettings(); } }, "MCP 服务器"),
      el("button", { class: "ghost", onclick: () => backdrop.remove() }, "稍后"),
      el("button", { class: "primary", onclick: save }, "保存"),
    );
    dialog.append(actions);
    backdrop.append(dialog);
    document.body.append(backdrop);
  }).catch(() => {
    state.notice = "无法读取模型设置，请重试。";
    render();
  });
}

function field(label, input) {
  return el("label", { class: "field" }, el("span", {}, label), input);
}

function executionCard({ ok, cancelled, exitCode, output }) {
  const status = cancelled ? "已取消" : ok ? "执行成功" : "执行失败";
  const label = exitCode == null ? status : `${status} · 退出码 ${exitCode}`;
  return el("section", { class: "execution-card", "aria-label": "PowerShell 执行结果" },
    el("div", { class: "execution-head" },
      el("strong", {}, "PowerShell"),
      el("span", { class: `execution-status ${cancelled ? "" : ok ? "success" : "failure"}` }, label)),
    output ? el("pre", { class: "action-code", tabindex: "0" }, output) : el("span", { class: "hint" }, "无输出"));
}

let approvalDialog;
window.arrodes.onApproval(({ id, action, detail, cwd, script }) => {
  const dialog = el("dialog", { class: "dialog role-dialog action-dialog", "aria-labelledby": "approval-title" });
  approvalDialog = { id, dialog };
  const respond = async (approved) => {
    for (const button of dialog.querySelectorAll("button")) button.disabled = true;
    try { await window.arrodes.approve({ id, approved }); }
    finally { if (dialog.open) dialog.close(); }
  };
  const cancel = el("button", { type: "button", class: "ghost", onclick: () => respond(false) }, "取消");
  const confirm = el("button", { type: "button", class: "send", onclick: () => respond(true) },
    script ? "运行脚本" : action === "应用源码修改" ? "应用改动" : "允许本次");
  dialog.append(el("h2", { id: "approval-title" }, action));
  if (script) {
    dialog.append(el("div", { class: "action-path" }, el("span", {}, "工作目录"), el("code", {}, cwd)),
      el("pre", { class: "action-code", tabindex: "0" }, script),
      el("p", { class: "hint" }, "脚本以当前 Windows 用户权限运行，可访问工作区以外的文件和网络。"));
  } else {
    dialog.append(el("pre", { class: "action-code", tabindex: "0" }, detail));
  }
  dialog.append(el("div", { class: "actions" }, cancel, confirm));
  dialog.addEventListener("cancel", (event) => { event.preventDefault(); respond(false); });
  dialog.addEventListener("close", () => {
    if (approvalDialog?.id === id) approvalDialog = null;
    dialog.remove();
  }, { once: true });
  document.body.append(dialog);
  dialog.showModal();
  cancel.focus();
});

window.arrodes.onApprovalClosed((id) => {
  if (approvalDialog?.id === id) approvalDialog.dialog.close();
});

window.arrodes.onProgress((payload) => {
  if (state.turn?.id !== payload.conversationId) return;
  state.turn.progress = payload.line;
  if (state.conversationId !== payload.conversationId) return;
  const thread = document.getElementById("thread");
  const progressNode = thread?.querySelector(".bubble.progress");
  if (progressNode) progressNode.textContent = payload.line;
  else render();
});
window.arrodes.onCanvasEvent(({ conversationId, event }) => {
  if (state.turn?.id === conversationId) state.turn.events.push(event);
  if (conversationId === state.conversationId) teamCanvas.receive(event);
});

document.addEventListener("click", (event) => {
  for (const id of ["workspace-picker", "approval-picker"]) {
    const picker = document.getElementById(id);
    if (picker?.open && !picker.contains(event.target)) picker.open = false;
  }
});

Promise.all([
  window.arrodes.getConfig(), window.arrodes.getConversation(),
  window.arrodes.listWorkspaces(), window.arrodes.listConversations(),
]).then(([config, conversation, workspaces, sessions]) => {
  state.configured = config.configured;
  state.workspaces = workspaces;
  state.sessions = sessions;
  showConversation(conversation);
  state.ready = true;
  render();
  document.getElementById("input")?.focus();
}).catch(showStartupError);
</script>
</body>
</html>
